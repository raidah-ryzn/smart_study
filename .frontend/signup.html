<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCourse - Daftar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <!-- LEFT SIDE - DECORATION & WELCOME -->
    <div class="login-left">
      <div class="login-left-content">
        <div class="welcome-badge">
          <span class="badge-icon">🚀</span>
        </div>
        <h1 class="welcome-title">Bergabunglah Hari Ini</h1>
        <p class="welcome-subtitle">Daftar sekarang dan mulai belajar dengan ribuan kursus berkualitas</p>

        <div class="features">
          <div class="feature-item">
            <span class="feature-icon">✓</span>
            <span class="feature-text">Gratis untuk 30 hari pertama</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">✓</span>
            <span class="feature-text">Akses penuh semua kursus</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">✓</span>
            <span class="feature-text">Sertifikat terakreditasi</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">✓</span>
            <span class="feature-text">Dukungan 24/7</span>
          </div>
        </div>
      </div>

      <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
    </div>

    <!-- RIGHT SIDE - SIGNUP FORM -->
    <div class="login-right">
      <div class="form-container">
        <div class="form-header">
          <h2>Buat Akun</h2>
          <p>Daftar untuk memulai pembelajaran</p>
        </div>

        <!-- Alert Messages -->
        <div id="signup-alert-message" class="alert" style="display: none;"></div>

        <!-- Signup Form -->
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Nama Lengkap</label>
            <input type="text" id="signup-name" name="name" placeholder="Nama Anda" required />
            <span class="error-message" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="nama@example.com" required />
            <span class="error-message" id="signup-email-error"></span>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="signup-password" name="password" placeholder="••••••••" required />
              <button type="button" class="toggle-password" onclick="toggleSignupPassword(event)">👁</button>
            </div>
            <span class="error-message" id="signup-password-error"></span>
          </div>

          <div class="form-group">
            <label for="signup-password-confirm">Konfirmasi Password</label>
            <div class="password-wrapper">
              <input type="password" id="signup-password-confirm" name="password_confirm" placeholder="••••••••" required />
              <button type="button" class="toggle-password" onclick="toggleSignupPasswordConfirm(event)">👁</button>
            </div>
            <span class="error-message" id="signup-password-confirm-error"></span>
          </div>

          <div class="form-group">
            <label for="signup-role">Daftar sebagai</label>
            <select id="signup-role" name="account_role">
              <option value="user">Pelajar</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <div class="form-group hidden" id="signup-admin-code-group">
            <label for="signup-admin-code">Kode Admin</label>
            <input type="password" id="signup-admin-code" name="admin_code" placeholder="Masukkan kode admin" />
            <span class="error-message" id="signup-admin-code-error"></span>
          </div>

          <button type="submit" class="btn-login">Daftar</button>
        </form>

        <div class="signup-link">
          Sudah punya akun? <a href="/login">Masuk di sini</a>
        </div>
      </div>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
